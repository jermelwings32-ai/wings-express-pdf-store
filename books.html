<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting to Jer'mel Wings on Amazon...</title>
    <!-- Instant client-side redirect to Amazon search page for Jer'mel Wings books -->
    <meta http-equiv="refresh" content="0; url=https://www.amazon.com/s?k=Jer%27mel+Wings">
    <script>
        window.location.href = "https://www.amazon.com/s?k=Jer%27mel+Wings";
    </script>
    <style>
        body {
            background-color: #0a0a14;
            color: #f0f0f8;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .container {
            max-width: 400px;
            padding: 24px;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(226, 183, 20, 0.1);
            border-radius: 50%;
            border-top-color: #e2b714;
            animation: spin 1s ease-in-out infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        h1 {
            font-size: 1.25rem;
            margin-bottom: 8px;
            font-weight: 600;
        }
        p {
            color: #a0a0b8;
            font-size: 0.9rem;
        }
        a {
            color: #e2b714;
            text-decoration: none;
            font-weight: 600;
        }
        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="spinner" aria-hidden="true"></div>
        <h1>Redirecting to Amazon</h1>
        <p>Opening Jer'mel Wings' official bookshelf directly in the Amazon app...</p>
        <p style="margin-top: 20px; font-size: 0.8rem;">
            <a href="https://www.amazon.com/s?k=Jer%27mel+Wings">Click here if you are not automatically redirected</a>
        </p>
    </div>
</body>
</html>
